name: Website quality gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Build production website
        run: npm run build
      - name: Verify routes, disclosure and booking contract
        run: node scripts/verify-site.mjs
