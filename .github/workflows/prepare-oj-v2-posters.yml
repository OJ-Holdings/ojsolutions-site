name: Prepare OJ v2 commercial posters
on:
  push:
    branches: [feat/approved-media-posters-20261026]
    paths:
      - .github/workflows/prepare-oj-v2-posters.yml
permissions:
  contents: write
jobs:
  render-posters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify user-uploaded source videos
        run: |
          test -s public/media/OJ_Solutions_Commercial_v2_hero30.mp4
          test -s public/media/OJ_Solutions_Commercial_v2_cut15.mp4
          command -v ffmpeg
          ffprobe -v error -show_entries format=duration -of default=nw=1 public/media/OJ_Solutions_Commercial_v2_hero30.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1 public/media/OJ_Solutions_Commercial_v2_cut15.mp4
      - name: Render responsive still posters
        run: |
          ffmpeg -hide_banner -loglevel error -ss 00:00:03 -i public/media/OJ_Solutions_Commercial_v2_hero30.mp4 -frames:v 1 -vf "scale='min(720,iw)':-2" -c:v libwebp -quality 78 public/media/commercial-hero-poster.webp -y
          ffmpeg -hide_banner -loglevel error -ss 00:00:02 -i public/media/OJ_Solutions_Commercial_v2_cut15.mp4 -frames:v 1 -vf "scale='min(720,iw)':-2" -c:v libwebp -quality 78 public/media/commercial-v2-cut15-poster.webp -y
          test -s public/media/commercial-hero-poster.webp
          test -s public/media/commercial-v2-cut15-poster.webp
          ls -lh public/media/*poster.webp
      - name: Commit and push approved video posters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/commercial-hero-poster.webp public/media/commercial-v2-cut15-poster.webp
          if ! git diff --cached --quiet; then
            git commit -m "media: generate poster frames from founders' v2 commercial cuts"
            git push origin HEAD:feat/approved-media-posters-20261026
          fi
